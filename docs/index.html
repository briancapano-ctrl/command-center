<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="command-center" content="1">
<meta name="theme-color" content="#f6f4ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
/* ===== Home: a decorated room that changes with the season, the holidays and the light ===== */
:root{
  --ground:#f6f4ef;--surface:#ece8df;--raised:#f9f7f3;--ink:#22211d;--ink2:#3d3b35;--muted:#5d5a52;--faint:#6b6860;
  --rule:rgba(34,33,29,.09);--border:rgba(34,33,29,.12);--accent:#4f5e2c;--trim:#5f6b45;--frame:#4a3a2a;--mat:#f3efe6;
  --negative:#b42318;--neg-bg:#f6dfda;--neg-ink:#7a1d14;--warn-bg:#f5e8d2;--warn-ink:#83400d;--neu-bg:rgba(34,33,29,.07);--pos:#2e6b3a;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;--sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --acc:var(--accent);--acc2:var(--ink2);--warn:var(--warn-ink);--bad:var(--negative);--ok:var(--pos);--mute:var(--muted);--dim:var(--faint);
  --line:var(--border);--card:var(--surface);--f:var(--sans);--m:var(--sans);
  --r:22px;--gap:.8rem;--gh:64px;
}
html[data-light=night]{
  --ground:#131311;--surface:#1d1c1a;--raised:#272623;--ink:#f0eee8;--ink2:#d6d3cb;--muted:#b3b0a8;--faint:#a19e96;
  --rule:rgba(240,238,232,.08);--border:rgba(240,238,232,.12);--mat:#d9d4c8;
  --negative:#ec7b6a;--neg-bg:#3a1f1b;--neg-ink:#f3a598;--warn-bg:#3a2c18;--warn-ink:#e9b877;--neu-bg:rgba(240,238,232,.08);--pos:#8fc79a;
}
*{box-sizing:border-box;margin:0}
html{font-size:16px;background:var(--ground);transition:background-color 1.6s ease}
body{min-height:100vh;color:var(--ink);background:var(--ground);font:400 .95rem/1.5 var(--sans);font-variant-numeric:tabular-nums lining-nums;
  -webkit-font-smoothing:antialiased;transition:background-color 1.6s ease,color 1.6s ease}
body.night{filter:brightness(.72)}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lbl{font:500 .82rem/1.2 var(--sans);color:var(--muted)}
.card{position:relative;background:var(--surface);border-radius:var(--r);padding:1.1rem 1.25rem;overflow:hidden;transition:background-color 1.6s ease}
.card>h2,.card>h2.lbl{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem;margin-bottom:.75rem;font:600 .9rem/1.2 var(--sans);color:var(--ink)}
.card>h2 .sub{font:400 .78rem var(--sans);color:var(--muted)}
.wrap{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:calc(var(--gh) + .6rem) 1.25rem 3rem}

/* garland, particles */
#garland{position:absolute;top:0;left:0;right:0;height:var(--gh);z-index:6;pointer-events:none;overflow:visible}
#garland svg{display:block;width:100%;height:calc(var(--gh) + 30px);overflow:visible}
#fx{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none}

/* header: clock, greeting, window */
.top{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:2.2rem;align-items:center;margin-bottom:1.1rem}
.clock{font:400 clamp(3.6rem,7vw,5.8rem)/.88 var(--serif);letter-spacing:-.02em;white-space:nowrap}
.clock small{font:500 .26em var(--sans);color:var(--muted);margin-left:.25em;letter-spacing:0;vertical-align:.25em}
.date{color:var(--muted);margin-top:.55rem;font-weight:500}
.hello h1{font:400 clamp(2rem,3.4vw,3.1rem)/1.02 var(--serif);letter-spacing:-.01em}
.hello p{color:var(--ink2);margin-top:.55rem;max-width:56ch;font-size:1.02rem}
.win{display:flex;flex-direction:column;align-items:center;gap:.3rem}
#window{width:clamp(250px,25vw,380px);aspect-ratio:4/3}
#window svg{width:100%;height:100%;display:block;overflow:visible}
.wx{color:var(--muted);font-size:.82rem;text-align:center;max-width:26rem}
.wx b{color:var(--ink);font:400 1.25rem var(--serif);margin-right:.25rem}

/* controls */
.ctl{position:fixed;top:.7rem;right:.7rem;display:flex;gap:.35rem;z-index:20;transition:opacity .4s}
.ctl button{font:500 .74rem var(--sans);color:var(--ink2);background:var(--surface);border:0;border-radius:999px;padding:.4rem .8rem;cursor:pointer;transition:background-color .2s,color .2s}
.ctl button:hover{background:var(--raised);color:var(--ink)}.ctl button.on{background:var(--ink);color:var(--ground)}
body.idle .ctl{opacity:0}
body.wall .ctl{top:auto;bottom:.6rem;right:.8rem}
@media(max-width:1700px){body.wall .ctl{top:.6rem;bottom:auto}}

/* counts */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:var(--gap);margin-bottom:var(--gap)}
.kpi{padding:1rem 1.2rem}
.kpi .v{font:400 clamp(2.3rem,3.4vw,3.1rem)/1 var(--serif);letter-spacing:-.01em;margin:.4rem 0 .25rem}
.kpi .v.txt{font-size:clamp(1.5rem,2.1vw,2rem);line-height:1.1;margin:.6rem 0 .35rem}
.kpi .n{color:var(--muted);font-size:.8rem}
.kpi svg.sp{display:none}
.clk{cursor:pointer;transition:background-color .2s}.clk:hover{background:var(--raised)}

/* main grid */
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,.95fr);gap:var(--gap);align-items:start}
.col{display:grid;gap:var(--gap)}
.task{display:grid;grid-template-columns:1.25rem 1fr auto auto;gap:.75rem;padding:.7rem 0;border-top:1px solid var(--rule);align-items:start}
.task:first-of-type{border-top:0}
.task input{appearance:none;width:1.15rem;height:1.15rem;margin-top:.15rem;border:1.5px solid var(--faint);border-radius:50%;cursor:pointer;display:grid;place-content:center;transition:background-color .2s,border-color .2s}
.task input:checked{background:var(--accent);border-color:var(--accent)}
.task input:checked::after{content:"";width:.3rem;height:.55rem;border:solid var(--ground);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.task .t{font-weight:500;font-size:1rem}.task .w{color:var(--muted);font-size:.8rem;margin-top:.15rem}
.task.done .t{text-decoration:line-through;color:var(--faint)}
.pill{font:500 .72rem var(--sans);padding:.22rem .6rem;border-radius:999px;white-space:nowrap;background:var(--neu-bg);color:var(--ink2)}
.p-high{background:var(--neg-bg);color:var(--neg-ink)}.p-med{background:var(--warn-bg);color:var(--warn-ink)}.p-low,.p-info{background:var(--neu-bg);color:var(--ink2)}
.empty{color:var(--muted);padding:.6rem 0}
.work .wrow{display:flex;justify-content:space-between;gap:1rem;align-items:baseline;padding:.45rem 0;border-top:1px solid var(--rule);font-size:.9rem}
.work .wrow:first-of-type{border-top:0}.work .wk{color:var(--muted);white-space:nowrap}.work .wv{font-weight:500;text-align:right}
.work .wv.hot{color:var(--warn-ink)}.work .wv.bad{color:var(--negative)}
.work .wlinks{display:flex;gap:.5rem;margin-top:.6rem;font-size:.78rem}.work .wlinks a{color:var(--ink2);text-decoration:none;background:var(--raised);border-radius:999px;padding:.25rem .7rem}.work .wlinks a:hover{color:var(--ink)}
body.wall .work .wlinks{display:none}
.work-open{margin-left:auto;white-space:nowrap;font:500 .78rem var(--sans);border:0;border-radius:99px;padding:.35rem .7rem;background:var(--ink);color:var(--ground);cursor:pointer}
.work-next{display:flex;flex-direction:column;gap:.25rem;margin:.6rem 0}.work-next small{color:var(--muted);font-size:.78rem}.work-next b{font-weight:500;font-size:.95rem}
.work-peek{display:flex;align-items:baseline;gap:.6rem;padding:.5rem 0;border-top:1px solid var(--rule);font-size:.9rem}
.work-priority{font-size:.75rem;font-weight:600;color:var(--muted);white-space:nowrap}
.work-priority.urgent{color:var(--negative)}.work-priority.watch{color:var(--warn-ink)}
.work-note{font-size:.75rem;color:var(--muted);line-height:1.5;margin-top:.5rem}
.sc-work{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);grid-template-rows:minmax(0,1fr) auto;gap:var(--gap);min-width:0}
.sc-work>.card{display:flex;flex-direction:column;min-width:0;padding:1.25rem}
.work-source{font-size:.85rem;color:var(--muted);margin:.1rem 0 1rem}
.work-scroll{min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;flex:1}
.work-appointment{display:grid;grid-template-columns:minmax(110px,.65fr) minmax(0,1.35fr);gap:.8rem;padding:1rem 0;border-top:1px solid var(--rule)}
.work-when{display:flex;flex-direction:column;gap:.25rem;font-size:.85rem}.work-when b{font-weight:600}.work-when span{color:var(--muted)}
.sc-work .work-appointment h3,.sc-work .work-item h3{font:600 1rem/1.35 var(--sans);color:var(--ink);margin:0;overflow-wrap:anywhere}
.work-appointment p,.work-appointment small{font-size:.8rem;color:var(--muted);margin:.3rem 0 0}
.work-item{padding:1rem 0 1.25rem;border-top:1px solid var(--rule)}.work-item .work-priority{display:inline-block;margin-bottom:.4rem}.work-item h3{display:block}
.work-new{display:inline-block;margin-left:.5rem;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--acc2)}
.work-item.handled{opacity:.5}
.work-handle{margin-top:.7rem;font:500 .74rem var(--sans);color:var(--ink2);background:var(--surface);border:0;border-radius:999px;padding:.3rem .8rem;cursor:pointer}.work-handle:hover{background:var(--raised);color:var(--ink)}
.work-toggle{margin:.6rem 0}
body.wall .work-handle{display:none}
.work-item p{font-size:.9rem;line-height:1.6;color:var(--ink2);margin:.6rem 0 0;overflow-wrap:anywhere}
.work-action{padding:.75rem 1rem;background:var(--raised);border-radius:12px;margin-top:.8rem}.work-action>b{font-size:.78rem;font-weight:600}.work-action p{margin-top:.3rem}
.work-bottom{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-top:1rem;border-top:1px solid var(--rule);font-size:.75rem;color:var(--muted)}
.work-bottom a{color:var(--ink);text-underline-offset:3px;white-space:nowrap}
.work-privacy{grid-column:1/-1;font-size:.75rem;color:var(--muted);margin:0}
body:not(.wall) .sc-work{height:auto;align-items:start}body:not(.wall) .sc-work .work-scroll{max-height:65vh}
@media(max-width:750px){.sc-work{grid-template-columns:1fr}.work-bottom{flex-wrap:wrap}.work-appointment{grid-template-columns:1fr;gap:.4rem}.work-when{flex-direction:row;gap:.6rem}.work-privacy{grid-column:auto}
body[data-scene=work]:not(.wall) .top>div:first-child,body[data-scene=work]:not(.wall) .top .win,body[data-scene=work]:not(.wall) .top .hang,body[data-scene=work]:not(.wall) .hello p{display:none}
body[data-scene=work]:not(.wall) .hello h1{font-size:1.5rem}body[data-scene=work]:not(.wall) .top{margin-bottom:.75rem}body[data-scene=work]:not(.wall) .wrap{padding-top:1rem}}
@media(orientation:portrait){body.wall .sc-work{grid-template-columns:1fr;grid-template-rows:minmax(0,.8fr) minmax(0,1.2fr) auto}}
.ev{display:grid;grid-template-columns:4.8rem 1fr auto;gap:.7rem;padding:.55rem 0;border-top:1px solid var(--rule);align-items:baseline}
.ev:first-of-type{border-top:0}
.ev .when{color:var(--muted);font-size:.8rem}.ev .what{font-weight:500}.ev .in{font:600 .76rem var(--sans);color:var(--accent)}
.ev.past{opacity:.5}.ev.now{background:var(--raised);border-radius:12px;margin:0 -.6rem;padding-left:.6rem;padding-right:.6rem;border-top-color:transparent}
.day{font:600 .8rem var(--sans);color:var(--muted);margin:.9rem 0 .2rem}
.day:first-child{margin-top:0}
.game{padding:.6rem 0;border-top:1px solid var(--rule)}.game:first-of-type{border-top:0}
.game .row{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem}
.game b{font-size:1rem;font-weight:600}.game .sc{font:400 1.5rem var(--serif)}
.game .st{color:var(--muted);font-size:.78rem;margin-top:.1rem}
.livetag{display:inline-flex;align-items:center;gap:.35rem;color:var(--negative);font:600 .74rem var(--sans)}
.livetag::before{content:"";width:.45rem;height:.45rem;border-radius:50%;background:var(--negative);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
.tri{width:100%;border-collapse:collapse;font-size:.84rem}.tri td{padding:.5rem .6rem .5rem 0;border-top:1px solid var(--rule);vertical-align:top}.tri tr:first-child td{border-top:0}.tri td:first-child{color:var(--muted);width:4.5rem;font-weight:500}.tri td:last-child{color:var(--ink2)}
.chan{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:var(--gap)}
.ch{padding:.9rem 1.1rem}.ch .nm{display:flex;justify-content:space-between;align-items:center;gap:.5rem;font-weight:600}
.ch .h{color:var(--muted);font-size:.76rem;margin:.1rem 0 .4rem;word-break:break-all}.ch .s{font-size:.88rem}.ch .x{color:var(--muted);font-size:.74rem;margin-top:.3rem}
.dot{width:.55rem;height:.55rem;border-radius:50%;background:var(--pos);flex:none}
.dot.snap{background:var(--warn-ink)}.dot.off{background:var(--faint)}.dot.bad{background:var(--negative)}
.health{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:1rem;color:var(--muted);font-size:.76rem;align-items:center}
.health span{display:inline-flex;align-items:center;gap:.4rem}
body:not(.wall) .health .hsum{display:none}
body.wall .health>span:not(.hsum){display:none}
.stale.crit{background:var(--neg-bg);color:var(--neg-ink)}
.stale{background:var(--warn-bg);color:var(--warn-ink);border-radius:14px;padding:.6rem .9rem;margin-bottom:.8rem;font-weight:500}
.foot{margin-top:1.4rem;color:var(--muted);font-size:.76rem;line-height:1.6}
.foot a{color:var(--ink2)}

/* the ring that counts what's done, in the Needs you header */
.ring{width:1.9rem;height:1.9rem;flex:none;cursor:pointer;position:relative;display:inline-block;vertical-align:middle}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bgc{stroke:var(--rule)}.ring .fg{stroke:var(--accent);transition:stroke-dashoffset .8s}
.ring b{display:none}
.hrow{display:block}

/* the framed print */
.print{display:flex;flex-direction:column}
.print .frame{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--frame);padding:clamp(8px,1.1vw,14px);border-radius:3px}
.print .mat{width:100%;height:100%;min-height:160px;background:var(--mat);display:flex;align-items:center;justify-content:center;padding:clamp(10px,1.8vw,26px)}
.print img{max-width:100%;max-height:100%;width:auto;height:auto;display:block;object-fit:contain}
.hang{position:relative;display:flex;flex-direction:column;align-items:center;margin:0;padding-top:26px;transform-origin:50% 0;animation:hangsway 11s ease-in-out infinite}
.hang svg.wire{position:absolute;top:0;left:0;width:100%;height:30px;overflow:visible;color:var(--muted)}
.hang .frame{background:var(--frame);padding:7px;border-radius:2px;box-shadow:0 14px 22px -12px rgba(20,16,10,.45),inset 0 0 0 1px rgba(255,255,255,.06)}
.hang .mat{background:var(--mat);padding:11px}
.hang img{display:block;height:clamp(110px,15vh,170px);width:auto;max-width:clamp(140px,16vw,260px);object-fit:contain}
.hang figcaption{margin-top:.5rem;font-size:.74rem;color:var(--muted);text-align:center;max-width:24ch;line-height:1.3}
body.wall .hang img{height:15vh;max-width:18vw}
@keyframes hangsway{0%,100%{transform:rotate(-.5deg)}50%{transform:rotate(.5deg)}}
@media (prefers-reduced-motion:reduce){.hang{animation:none}}
#print{display:none}
@media(max-width:1180px){.hang{display:none}#print{display:flex}}
@media (orientation:portrait){body.wall .hang{display:none}body.wall #print{display:flex}}
body.wall .alm-print .hang img{height:auto;max-width:100%;max-height:calc(100vh - 690px);min-height:140px}
@media (orientation:portrait){body.wall .alm-print .hang{display:flex}body.wall .alm-print .hang img{max-height:18vh}}
.print .pbody{display:flex;flex-direction:column;flex:1;min-height:0}
body.wall .print .pbody{flex-direction:row;gap:1rem;align-items:stretch;container-type:size}
body.wall .print .frame{flex:none;height:100%;aspect-ratio:1/1;max-width:58%;padding:6px}
body.wall .print .mat{min-height:0;padding:8px}
body.wall .print figcaption{margin:0;align-self:center;font-size:.9rem}
@container (max-height:70px){ body.wall .print .frame{display:none} }
body.wall .health{max-width:calc(50% - 330px);flex-wrap:nowrap;overflow:hidden;white-space:nowrap;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
.print figcaption{margin-top:.7rem;font-size:.84rem;color:var(--ink2);line-height:1.35}
.print figcaption span{display:block;color:var(--muted);font-size:.78rem}
body:not(.wall) .print .frame{aspect-ratio:4/3;flex:none}

/* almanac */
.alm{display:grid;grid-template-columns:auto 1fr;gap:.9rem 1.1rem;align-items:center}
.alm svg.moon{width:4.2rem;height:4.2rem}
.alm .big2{font:400 1.7rem/1.05 var(--serif)}
.alm .lines div{padding:.42rem 0;border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:1rem;font-size:.9rem}
.alm .lines div:first-child{border-top:0}
.alm .lines span{color:var(--muted)}
.alm .lines{grid-column:1/-1}

/* lock: the front door */
#lock{max-width:360px;margin:20vh auto;padding:0 1rem;text-align:center}
#lock h1{font:400 2.8rem/1 var(--serif);margin-bottom:.5rem}#lock p{color:var(--muted);margin-bottom:1.2rem}
#lock input[type=password]{width:100%;padding:.85rem 1rem;border-radius:999px;border:1px solid var(--border);background:var(--raised);color:var(--ink);font:400 1rem var(--sans);text-align:center}
#lock button{margin-top:.8rem;width:100%;padding:.85rem;border-radius:999px;border:0;background:var(--ink);color:var(--ground);font:600 1rem var(--sans);cursor:pointer}
#lock label{display:block;margin-top:.8rem;color:var(--muted);font-size:.84rem}#msg{color:var(--negative);margin-top:.7rem;min-height:1.2em}

/* WALL: one screen, no scrolling */
body.wall{height:100vh;overflow:hidden;--gh:6.4vh}
body.wall .wrap{max-width:none;height:100vh;padding:calc(var(--gh) + .4vh) 1.6vw 1.2vh;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto auto;gap:1.3vh}
body.wall #stale:empty{margin-top:-1.3vh}
body.wall{font-size:clamp(13px,.55vw + .85vh,26px)}
body.wall .top{margin:0;gap:2.4vw}
body.wall .clock{font-size:clamp(3.6rem,12vh,10rem)}
body.wall #window{width:auto;height:21vh}
body.wall .hello h1{font-size:clamp(2rem,5.6vh,4.6rem)}
body.wall .kpis{margin:0;grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:1fr}
body.wall .kpi .v{font-size:clamp(2.2rem,6.4vh,5rem)}
body.wall .kpi .v.txt{font-size:clamp(1.5rem,3.9vh,3rem)}
body.wall .grid{grid-template-columns:1.25fr 1fr .95fr;min-height:0;height:100%}
body.wall .col{display:grid;height:100%;min-height:0;grid-template-rows:minmax(0,1fr);align-content:stretch;overflow:hidden}
body.wall .col:last-child{grid-template-rows:auto minmax(0,1fr)}
body.wall .col .card.fill{min-height:0;overflow:hidden}
body.wall .foot,body.wall .chan-sec,body.wall .desk-only,body.wall .tri-card,body.wall #mem,body.wall #bdays{display:none}
body.wall .wall-strip{display:flex}
.wall-strip{display:none;gap:.5rem;flex-wrap:wrap;align-items:center;justify-content:space-between}
.wall-strip .chip{display:inline-flex;align-items:center;gap:.5rem;padding:.4rem .85rem;border-radius:999px;background:var(--surface);font-size:.8em}

@media(max-width:980px){
  .top{grid-template-columns:1fr;gap:1rem}.win{align-items:flex-start}#window{width:min(100%,380px)}
  .grid{grid-template-columns:1fr}.ctl{position:static;margin:0 0 .6rem;flex-wrap:wrap}body.wall .ctl{position:fixed;margin:0}
  .wrap{padding-left:1rem;padding-right:1rem}
}
@media (orientation:portrait){
  body.wall{font-size:clamp(13px,1.45vw + .45vh,28px);--gh:4.6vh}
  body.wall .wrap{padding:calc(var(--gh) + .4vh) 2.6vw 1.2vh;gap:1vh}
  body.wall .top{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"clock win" "hello hello";row-gap:1vh}

/* ---------- crypto ---------- */
async function decryptBlob(blob, pass){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(blob.salt), iterations:blob.iter, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(blob.iv)}, key, b64(blob.ct))));
}

function spark(vals, color){
  if(!vals || vals.length<2) return "";
  const w=100,h=40,mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;
  const pts = vals.map((v,i)=>[(i/(vals.length-1))*w, h-4-((v-mn)/r)*(h-8)]);
  const d = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const last = pts[pts.length-1];
  return `<svg class="sp" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="2.2" fill="${color}"/></svg>`;
}

let fitQ=0;
function fit(){ cancelAnimationFrame(fitQ); fitQ=requestAnimationFrame(()=>{
  const items = c => [...c.querySelectorAll("#tasks>*, #events>*, #teams>*, .tri tr, #work .wrow, #bdays .bd, #home .hm>*")];
  document.querySelectorAll(".grid .col").forEach(col=>{

    if(!document.body.classList.contains("wall")) return;

      let target = cards.find(c=>over(c) && items(c).filter(i=>i.style.display!=="none").length>1);

      let vis = items(target).filter(i=>i.style.display!=="none"); vis[vis.length-1].style.display="none";
      vis = items(target).filter(i=>i.style.display!=="none"); while(vis.length>1 && vis[vis.length-1].classList.contains("day")){ vis[vis.length-1].style.display="none"; vis.pop(); }

/* Morning brief, meeting lead-up and conflict check. Work details stay in this browser. */
function briefLine(){
  try{
    const now=new Date(), nowMs=now.getTime(), tk=dkey(now), up=workUpcoming();
    const today=up.filter(x=>!x.allDay&&dkey(new Date(x.s))===tk);
    const nx=today.find(x=>Date.parse(x.s)>nowMs-60000), soon=up.find(x=>!x.allDay&&Date.parse(x.s)>nowMs-60000&&Date.parse(x.s)-nowMs<=15*60000);
    if(soon){ const m=Math.round((Date.parse(soon.s)-nowMs)/60000);
      return m<=0?`${soon.title} is starting now.`:`${soon.title} starts in ${m} minute${m===1?"":"s"}.`; }
    const mine=(D.events||[]).filter(e=>!e.all_day&&e.start&&dkey(new Date(e.start))===tk).map(e=>({t:e.title,s:Date.parse(e.start),e:e.end?Date.parse(e.end):Date.parse(e.start)+3600000}));
    const clash=today.filter(w=>Date.parse(w.e)>nowMs).map(w=>({w,p:mine.find(q=>q.s<Date.parse(w.e)&&q.e>Date.parse(w.s)&&q.e>nowMs)})).find(x=>x.p);
    const hr=Number(new Intl.DateTimeFormat("en-US",{hour:"numeric",hour12:false,timeZone:TZ()}).format(now))%24;
    if(hr>=5&&hr<11&&(today.length||mine.length)){
      let t=`Today: ${today.length} work meeting${today.length===1?"":"s"}`;
      if(nx) t+=`, first up ${fmtTime(new Date(nx.s))}`;
      if(mine.length) t+=`, ${mine.length} personal`;
      t+=".";
      if(clash) t+=` Heads up: ${clash.p.t} overlaps a work meeting at ${fmtTime(new Date(clash.w.s))}.`;
      return t;
    }
    if(clash && Date.parse(clash.w.s)-nowMs<4*3600000) return `Heads up: ${clash.p.t} overlaps a work meeting at ${fmtTime(new Date(clash.w.s))}.`;
  }catch(e){}
  return "";
}

async function toggleAwake(){
  try{
    if(wake){ await wake.release(); wake=null; $("#bAwake").classList.remove("on"); return; }
    wake = await navigator.wakeLock.request("screen"); $("#bAwake").classList.add("on");
    wake.addEventListener("release",()=>{wake=null;$("#bAwake").classList.remove("on")});
  }catch(e){ $("#bAwake").textContent="Not supported"; }
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && $("#bAwake")?.classList.contains("on")===false && store.getItem("awake")==="1") toggleAwake(); });
let idleT; function wakeUI(){ document.body.classList.remove("idle"); clearTimeout(idleT); idleT=setTimeout(()=>document.body.classList.add("idle"),6000); }
["mousemove","keydown","touchstart"].forEach(e=>addEventListener(e,wakeUI,{passive:true}));
addEventListener("keydown",e=>{ if(e.target.tagName==="INPUT") return; if(e.key==="w"||e.key==="W") setWall(!document.body.classList.contains("wall")); if(e.key==="f"||e.key==="F") toggleFs(); });
function toggleFs(){ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); }

function logo(path,abbr){return `<img src="${esc(lg(path,abbr))}" alt="" onerror="this.style.visibility='hidden'">`}
function bars(rows){
  const m=Math.max(1,...rows.map(r=>r.n||0));
  return rows.map(r=>{
    const inner=`<span class="bl">${esc(r.label)}</span><span class="bt"><i style="width:${Math.max(2,(r.n||0)/m*100)}%;background:${r.color||"var(--acc)"}"></i></span><span class="bn">${fmtN(r.n)}</span>`;
    return r.href?`<a class="bar" href="${esc(r.href)}" target="_blank" rel="noopener">${inner}</a>`:`<div class="bar">${inner}</div>`;
  }).join("");
}

function localTasks(){try{return JSON.parse(store.getItem("cc_local")||"[]")}catch(e){return[]}}
function allTasks(){

function taskRows(list,done){
  return list.length? list.map(x=>`<label class="task ${done[x.t]?"done":""}"><input type="checkbox" data-t="${esc(x.t)}" ${done[x.t]?"checked":""}><span><div class="t">${esc(x.t)}</div><div class="w">${esc(x.w)}</div></span><span class="pill ${esc(x.p[1])}">${esc(x.p[0])}</span><button class="x" data-hide="${esc(x.t)}" data-local="${x.local?1:0}" title="${x.local?"Remove":"Hide until tomorrow"}">&times;</button></label>`).join("")
   : '<div class="w" style="padding:.6rem 0">All clear. Nothing needs you.</div>';
}
function renderTasks(){
  let done={};try{done=JSON.parse(store.getItem("done:"+today())||"{}")}catch(e){}
  const list=allTasks();
  $("#tasks").innerHTML=taskRows(list,done);
  const n=list.filter(x=>done[x.t]).length;
  $("#prog").textContent=list.length?`${n} of ${list.length} done`:"";
  renderRing(n,list.length);

function renderRing(n,total){
  const el=$("#ring"); if(!el) return;
  const r=18,c=2*Math.PI*r,p=total?n/total:1;
  el.classList.toggle("cleared",total>0&&n===total);
  el.innerHTML=`<svg viewBox="0 0 44 44"><circle class="bgc" cx="22" cy="22" r="${r}" fill="none" stroke-width="4"/><circle class="fg" cx="22" cy="22" r="${r}" fill="none" stroke-width="4" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}"/></svg><b>${total?`${n}/${total}`:"&#10003;"}</b>`;
}
document.addEventListener("change",e=>{
  const b=e.target.closest?.(".task input"); if(!b) return;
  let done={};try{done=JSON.parse(store.getItem("done:"+today())||"{}")}catch(x){}
  done[b.dataset.t]=b.checked; store.setItem("done:"+today(),JSON.stringify(done)); renderTasks();
});
document.addEventListener("click",e=>{
  const h=e.target.closest?.("[data-hide]");
  if(h){ e.preventDefault();
    if(h.dataset.local==="1") store.setItem("cc_local",JSON.stringify(localTasks().filter(t=>t.t!==h.dataset.hide)));
    else { let m={};try{m=JSON.parse(store.getItem("hide:"+today())||"{}")}catch(x){} m[h.dataset.hide]=1; store.setItem("hide:"+today(),JSON.stringify(m)); }
    renderTasks(); return; }

document.addEventListener("submit",e=>{

const COUNT=(ms)=>{ if(ms<0) return "now"; const m=Math.round(ms/60000); if(m<60) return m+" min"; const h=Math.floor(m/60); return h<48? h+"h "+(m%60)+"m" : Math.round(h/24)+" days"; };
function sceneToday(){
  const now=new Date(), tk=dkey(now);
  const evs=(D.events||[]).filter(e=>e.start&&(e.all_day?e.start.slice(0,10)===tk:dkey(new Date(e.start))===tk));
  const wk=(typeof workAll==="function"?workAll():[]).filter(x=>dkey(new Date(x.s))===tk).map(x=>({title:x.title,start:x.s,end:x.e,all_day:!!x.allDay,work:true}));
  const allday=[...evs,...wk].filter(e=>e.all_day);
  const timed=[...evs,...wk].filter(e=>!e.all_day).map(e=>{const s=new Date(e.start);return{...e,s,e2:e.end?new Date(e.end):new Date(s.getTime()+3600000)}});
  let h0=7,h1=21; timed.forEach(e=>{h0=Math.min(h0,Math.floor(minsOf(e.s)));h1=Math.max(h1,Math.ceil(minsOf(e.e2)))}); h0=Math.min(h0,Math.floor(minsOf(now))); h1=Math.min(24,Math.max(h1,h0+8));
  const span=h1-h0, pct=h=>(h-h0)/span*100;
  const lines=Array.from({length:span+1},(_,i)=>`<div class="hr" style="top:${pct(h0+i)}%"><span>${fmtHour(h0+i)}</span></div>`).join("");
  const blocks=timed.map(e=>`<div class="blk${e.work?" work":""}" style="top:${pct(minsOf(e.s))}%;height:${Math.max(4,pct(minsOf(e.e2))-pct(minsOf(e.s)))}%"><b>${esc(e.title)}</b><small>${e.work?"Work · ":""}${esc(fmtTime(e.s))}</small></div>`).join("");
  const nm=minsOf(now), nl=nm>=h0&&nm<=h1?`<div class="nowl" style="top:${pct(nm)}%"><span>${esc(fmtTime(now))}</span></div>`:"";
  const empty=!timed.length&&!allday.length?`<div class="w" style="position:absolute;left:.9rem;top:30%;right:.9rem;text-align:center;font-size:1.05rem">Nothing on the calendar today.<br>A clear runway.</div>`:"";
  const hrs=(WX?.hourly||[]).slice(0,12).map((h,i)=>`<div>${i===0?"Now":fmtHour(h.h)}${WXI[wxInfo(h.code)[0]]}<b>${Math.round(h.t)}&deg;</b>${h.pp>=20?`<span style="color:var(--acc2)">${h.pp}%</span>`:"&nbsp;"}</div>`).join("");
  let done={};try{done=JSON.parse(store.getItem("done:"+today())||"{}")}catch(e){}
  const open=allTasks().filter(x=>!done[x.t]).slice(0,5);
  return `<div class="sc sc-today">
   <section class="card tl"><h2 class="lbl">Today <span class="sub">${esc(now.toLocaleDateString([],{weekday:"long",month:"long",day:"numeric",timeZone:TZ()}))}</span></h2>
     ${allday.length?`<div class="chips">${allday.map(e=>`<span class="chip2">${e.work?"Work · ":""}${esc(e.title)}</span>`).join("")}</div>`:""}
     <div class="tlin${timed.some(e=>e.work)&&timed.some(e=>!e.work)?" two":""}">${lines}${blocks}${nl}${empty}</div></section>
   <div class="side"><section class="card"><h2 class="lbl">Next 12 hours <span class="sub">${WX?`${Math.round(WX.t)}&deg; now`:""}</span></h2>${hrs?`<div class="hourly">${hrs}</div>`:'<div class="w">Loading forecast</div>'}
     ${WX?.sunrise?`<div class="sun"><span>Sunrise ${esc(WX.sunrise)}</span><span>Sunset ${esc(WX.sunset)}</span></div>`:""}</section>
     <section class="card"><h2 class="lbl">Still open <span class="sub">${open.length} shown</span></h2>${open.length?open.map(x=>`<div class="it">${esc(x.t)}<small>${esc(x.w)}</small></div>`).join(""):'<div class="w">All clear.</div>'}</section></div></div>`;
}
function sceneSports(){

    const L=LIVE[t.team], lt=(t.last||[])[0], nx=(t.next||[])[0];
    const me=lg(t.path,t.abbr);

      else {mid=`<div class="score">${esc(away.s)} - ${esc(home.s)}</div>`; status=L.state==="in"?`<div class="cd" style="color:var(--bad)">Live &middot; ${esc(L.detail||"")}</div>`:`<div class="cd">Final</div>`; if(L.state==="in")cls="live";}
    } else if(nx){
      const parts=String(nx.name||"").split(/\s+(?:@|at|vs\.?)\s+/i); away={a:parts[0]}; home={a:parts[1]||t.abbr};

    return `<section class="card gc ${cls}"><h2 class="lbl">${esc(t.team)}</h2><div class="vs">${side(away)}<div class="mid">${mid}${status}</div>${side(home)}</div><div class="last">${esc(lastTxt)}</div></section>`;
  }).join("");

function sceneWeek(){
  const now=new Date(), base=Date.parse(dkey(now)+"T12:00:00");
  const days=Array.from({length:7},(_,i)=>{const d=new Date(base+i*86400000);return{k:dkey(d),d}});
  const wx={};(WX?.daily||[]).forEach(w=>wx[w.d]=w);
  const cols=days.map((x,i)=>{
    const wkEv=(typeof workAll==="function"?workAll():[]).filter(w=>dkey(new Date(w.s))===x.k).map(w=>({title:w.title,start:w.s,all_day:!!w.allDay,work:true}));
    const ev=[...(D.events||[]),...wkEv].filter(e=>e.start&&(e.all_day?e.start.slice(0,10)===x.k:dkey(new Date(e.start))===x.k)).sort((a,b)=>(b.all_day?1:0)-(a.all_day?1:0)||new Date(a.start)-new Date(b.start));
    const gm=(D.teams||[]).flatMap(t=>(t.next||[]).filter(n=>dkey(new Date(n.when))===x.k).map(n=>({t:t.team,n})));
    const w=wx[x.k];
    return `<section class="card day7 ${i===0?"today":""}"><div class="dh"><b>${i===0?"Today":x.d.toLocaleDateString([],{weekday:"short",timeZone:"UTC"})} <span style="color:var(--mute);font-weight:500">${x.d.getUTCDate()}</span></b>${w?`<small>${WXI[wxInfo(w.code)[0]]}${Math.round(w.hi)}&deg;/${Math.round(w.lo)}&deg;</small>`:""}</div>
      ${ev.map(e=>`<div class="it ${e.all_day?"ad":""}">${esc(e.title)}<small>${e.work?"Work · ":""}${e.all_day?"All day":esc(fmtTime(new Date(e.start)))}</small></div>`).join("")}
      ${gm.map(g=>`<div class="it game">${esc(g.t)}<small>${esc(g.n.name)} &middot; ${esc(fmtTime(new Date(g.n.when)))}</small></div>`).join("")}
      ${!ev.length&&!gm.length?'<div class="w" style="color:var(--dim)">Open</div>':""}</section>`;
  }).join("");
  return `<div class="sc sc-week">${cols}</div>`;
}

function renderScene(fresh=true){
  const ov=$("#overlay"); if(!ov) return; ov.classList.toggle("still",!fresh);

  DECOR={id,th,li,night,now,art,game:g,g:g&&g.team,bday:b,b:b&&b.name,major};
  const bt=$("#bDecor"); if(bt) bt.textContent="Decor: "+((QS.get("decor")||store.getItem("cc_decor"))?th.name:"Auto");
  drawWindow(); if(changed){ drawGarland(); fxSetup(); } renderPrint(); renderAlmanac();
}

/* ---------- the garland across the top of the room ---------- */
function drawGarland(){
  const el=$("#garland"); if(!el) return;
  const W=Math.max(320,el.clientWidth||innerWidth), H=el.clientHeight||64, {th,id,night}=DECOR, R=rng(7);
  const anim=!matchMedia("(prefers-reduced-motion: reduce)").matches;
  const swags=W>1500?3:W>700?2:1, sag=H*.5, pts=[];
  let s=`<svg viewBox="0 0 ${W} ${H+30}" aria-hidden="true">`;
  const kind = DECOR.bday?"birthday":(DECOR.game&&!DECOR.major&&TEAMLOOK[DECOR.game.team])?"team":th.garland;
  const stringC = night?"#5e5a50":"#8b8475";
  for(let i=0;i<swags;i++){
    const x0=W*i/swags, x1=W*(i+1)/swags, cx=(x0+x1)/2;
    s+=`<path d="M${x0},4 Q${cx},${4+sag*2} ${x1},4" fill="none" stroke="${stringC}" stroke-width="1.6"/>`;
    const span=x1-x0, step=kind==="bough"?7:kind==="birthday"||kind==="team"||kind==="bunting"||kind==="pennants"||kind==="halloween"?Math.max(34,Math.min(54,span/14)):Math.max(46,Math.min(70,span/9));
    const n=Math.max(3,Math.floor(span/step));
    for(let j=1;j<n;j++){ const t=j/n, x=(1-t)*(1-t)*x0+2*(1-t)*t*cx+t*t*x1, y=(1-t)*(1-t)*4+2*(1-t)*t*(4+sag*2)+t*t*4; const a=Math.atan2(2*(1-t)*(sag*2)+2*t*(-sag*2),span)*180/Math.PI; pts.push({x,y,a,i,j,n}); }
    s+=`<circle cx="${x0+1}" cy="4" r="3" fill="${stringC}"/>`;
  }
  s+=`<circle cx="${W-2}" cy="4" r="3" fill="${stringC}"/>`;
  const sway=(d)=>anim?`<animateTransform attributeName="transform" type="rotate" values="-4;4;-4" dur="${(4+R()*3).toFixed(1)}s" begin="-${(R()*5).toFixed(1)}s" repeatCount="indefinite"/>`:"";
  const tw=()=>anim?`<animate attributeName="opacity" values="1;.45;1" dur="${(1.6+R()*2.4).toFixed(1)}s" begin="-${(R()*3).toFixed(1)}s" repeatCount="indefinite"/>`:"";
  const hang=(p,inner)=>`<g transform="translate(${p.x.toFixed(1)},${p.y.toFixed(1)})"><g>${inner}${sway()}</g></g>`;
  const sc=Math.min(1.25,Math.max(.75,H/64));
  const leaf=c=>`<g transform="scale(${sc})"><path d="M0,0 L0,5" stroke="#6b5a3a" stroke-width="1.2"/><path d="M0,5 C9,9 11,20 0,30 C-11,20 -9,9 0,5Z" fill="${c}"/><path d="M0,7 L0,27" stroke="rgba(0,0,0,.22)" stroke-width="1"/></g>`;
  const acorn=()=>`<g transform="scale(${sc})"><path d="M0,0 L0,4" stroke="#6b5a3a" stroke-width="1.2"/><ellipse cx="0" cy="14" rx="6" ry="8" fill="#b07a3a"/><path d="M-7,9 Q0,1 7,9 Z" fill="#6e4c2a"/></g>`;
  const pennant=(c,ch,ink)=>`<g transform="scale(${sc})"><path d="M-12,0 L12,0 L0,30 Z" fill="${c}"/>${ch&&ch!==" "?`<text x="0" y="14" text-anchor="middle" font-family="Instrument Sans,system-ui,sans-serif" font-weight="600" font-size="12" fill="${ink||"#fff"}">${ch}</text>`:""}</g>`;
  const heart=c=>`<g transform="scale(${sc})"><path d="M0,0 L0,6" stroke="${stringC}" stroke-width="1"/><path d="M0,26 C-14,16 -12,5 -5,5 C-2,5 0,8 0,10 C0,8 2,5 5,5 C12,5 14,16 0,26Z" fill="${c}"/></g>`;
  const star=c=>{ let p=""; for(let k=0;k<10;k++){ const r=k%2?5:12, an=-Math.PI/2+k*Math.PI/5; p+=`${(Math.cos(an)*r).toFixed(1)},${(16+Math.sin(an)*r).toFixed(1)} `; } return `<g transform="scale(${sc})"><path d="M0,0 L0,5" stroke="${stringC}" stroke-width="1"/><polygon points="${p}" fill="${c}"/></g>`; };
  const flake=c=>`<g transform="scale(${sc})" stroke="${c}" stroke-width="1.6" stroke-linecap="round"><path d="M0,0 L0,4" stroke="${stringC}" stroke-width="1"/>${[0,60,120].map(r=>`<g transform="translate(0,16) rotate(${r})"><path d="M0,-11 L0,11 M-3,-8 L0,-5 L3,-8 M-3,8 L0,5 L3,8"/></g>`).join("")}</g>`;
  const shamrock=c=>`<g transform="scale(${sc})"><path d="M0,0 L0,6" stroke="${stringC}" stroke-width="1"/>${[0,120,240].map(r=>`<g transform="translate(0,16) rotate(${r})"><path d="M0,0 C-7,-4 -7,-11 -3,-11 C-1,-11 0,-9 0,-8 C0,-9 1,-11 3,-11 C7,-11 7,-4 0,0Z" fill="${c}"/></g>`).join("")}<path d="M0,16 Q2,24 5,28" stroke="${c}" stroke-width="1.8" fill="none"/></g>`;
  const blossom=c=>`<g transform="scale(${sc})"><path d="M0,0 L0,6" stroke="#7a8f62" stroke-width="1"/>${[0,72,144,216,288].map(r=>`<ellipse cx="0" cy="-6" rx="4.5" ry="6" fill="${c}" transform="translate(0,15) rotate(${r})"/>`).join("")}<circle cx="0" cy="15" r="3" fill="#e2b04a"/></g>`;
  const egg=c=>`<g transform="scale(${sc})"><path d="M0,0 L0,4" stroke="${stringC}" stroke-width="1"/><ellipse cx="0" cy="16" rx="8" ry="11" fill="${c}"/><path d="M-8,15 Q0,12 8,15 L8,18 Q0,15 -8,18Z" fill="rgba(255,255,255,.75)"/></g>`;
  const bulb=(c)=>`<g transform="scale(${sc})"><rect x="-2.5" y="0" width="5" height="4" fill="#3b3a35"/><ellipse cx="0" cy="10" rx="4.2" ry="6.5" fill="${c}">${tw()}</ellipse></g>`;
  let body="";
  if(kind==="bough"){
    const greens=night?["#24402f","#2e5039","#1b3324"]:["#2f5b3e","#3d6e4a","#24492f"];
    pts.forEach((p,k)=>{ for(let q=0;q<5;q++){ const an=(R()*360)|0, L=9+R()*9; body+=`<path d="M${p.x.toFixed(1)},${p.y.toFixed(1)} l${(Math.cos(an*Math.PI/180)*L).toFixed(1)},${(Math.sin(an*Math.PI/180)*L*.7+2).toFixed(1)}" stroke="${greens[q%3]}" stroke-width="2.4" stroke-linecap="round"/>`; } });
    const cols=["#c8352e","#e0a83a","#2f7d4f","#3d6fa8","#f2efe6"];
    pts.forEach((p,k)=>{ if(k%9===4) body+=hang({...p,y:p.y+4},bulb(cols[(k/9|0)%cols.length])); if(k%23===11) body+=`<g transform="translate(${p.x.toFixed(1)},${(p.y+3).toFixed(1)})"><circle r="3.4" fill="#a3242c"/><circle cx="5" cy="2" r="3.4" fill="#b8282f"/><circle cx="2" cy="-4" r="3" fill="#a3242c"/></g>`; });
  } else {
    pts.forEach((p,k)=>{
      let m="";
      if(kind==="leaves"){ const c=["#c8642a","#d99a2b","#a8452a","#8a8a3a"][k%4]; m=leaf(c); }
      else if(kind==="harvest"){ m=k%3===1?acorn():leaf(["#b8752e","#9a5a2a","#c99a3a"][k%3]); }
      else if(kind==="halloween"){ m=pennant(k%2?"#2a2926":"#d9661f"); }
      else if(kind==="stars"){ m=star(k%2?"#c9b06a":"#c9cdd2"); }
      else if(kind==="flakes"){ m=flake(night?"#cfe0ea":"#7f9db1"); }
      else if(kind==="hearts"){ m=heart(["#b8324f","#e38aa0","#f2d2d9"][k%3]); }
      else if(kind==="shamrocks"){ m=shamrock(k%2?"#2f7d4f":"#4f9a5f"); }
      else if(kind==="blossoms"){ m=blossom(k%2?"#f2c9d3":"#fbeef0"); }
      else if(kind==="eggs"){ m=egg(["#e9b8c4","#b9d7e6","#efd99a","#c5ddb5"][k%4]); }
      else if(kind==="pennants"){ m=pennant(["#1d6a7a","#e9c46a","#f4f1e8","#7fb3ba"][k%4]); }
      else if(kind==="bunting"){ m=pennant(["#b5303a","#f5f3ee","#27466e"][k%3]); }
      if(m) body+=hang(p,m);
    });
    if(kind==="birthday"||kind==="team"){
      const look=kind==="team"?TEAMLOOK[DECOR.game.team]:null;
      const words=kind==="team"?look.w:("HAPPY BIRTHDAY "+String(DECOR.bday.name).split(/[\s(]/)[0].toUpperCase());
      const cols=kind==="team"?look.c:["#d9661f","#2b6d43","#27466e","#b8324f","#e0a83a"];
      let letters=[...words]; if(letters.length>pts.length) letters=[..."HAPPY BIRTHDAY"].slice(0,pts.length);
      const start=Math.max(0,Math.floor((pts.length-letters.length)/2));
      body=pts.map((p,k)=>{ const ch=letters[k-start]; return hang(p,pennant(cols[k%cols.length],ch||"",look?look.ink:"#fff")); }).join("");
    }
  }
  el.innerHTML=s+body+"</svg>";
}

/* ---------- the window: real sky, real sun and moon, the weather, the season outside, the sill ---------- */
function drawWindow(){
  const el=$("#window"); if(!el) return;
  const {th,id,li,night,now}=DECOR, ph=li.phase, code=WX?WX.code:1, anim=!matchMedia("(prefers-reduced-motion: reduce)").matches;
  const rain=(code>=51&&code<=67)||(code>=80&&code<=82)||code>=95, snow=(code>=71&&code<=77)||code===85||code===86, fog=code===45||code===48, over=code===3||rain||snow||fog, part=code===2;
  const R=rng(Number(ymd(now).replace(/-/g,"")));
  const sky={night:["#151d33","#1b2440","#222c4b"],dawn:["#3b4a72","#9a7fa0","#e3b49a"],morning:["#9cc3dc","#c3d9e6","#efd9bf"],day:["#8fbad6","#a9cbe1","#c8deea"],golden:["#a9bcd0","#e8c79c","#f2d3a6"],dusk:["#2f3a62","#6a5f86","#c98d7a"]}[ph]||["#8fbad6","#a9cbe1","#c8deea"];
  const grey=night?["#1d222c","#232934","#2a303b"]:["#9aa3aa","#adb5bb","#c0c7cc"];
  const S=over?grey:sky;

  o+=`<g clip-path="url(#${cl})">`;

  const t=now.getTime();
  if(!night||ph==="dusk"){
    const f=Math.min(1,Math.max(0,(t-li.s.rise)/(li.s.set-li.s.rise)));
    if(t>li.s.rise-20*60000&&t<+li.s.set+20*60000&&!over){ const sx=X0+20+f*(W-40), sy=Y0+150-Math.sin(Math.PI*f)*120; o+=`<circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="13" fill="${ph==="golden"||ph==="dawn"||ph==="morning"?"#f1a95b":"#f6d36b"}"/>`; }
  }
  if(night){
    if(!over) for(let k=0;k<22;k++){ const x=X0+R()*W, y=Y0+R()*110; o+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(0.6+R()*0.9).toFixed(2)}" fill="#f4f1e6">${anim?`<animate attributeName="opacity" values="1;.3;1" dur="${(2+R()*4).toFixed(1)}s" begin="-${(R()*4).toFixed(1)}s" repeatCount="indefinite"/>`:""}</circle>`; }
    const nr=li.tm.rise, ps=li.s.set>t?li.y.set:li.s.set; const nextRise=t<li.s.rise?li.s.rise:nr;
    const f=Math.min(1,Math.max(0,(t-ps)/(nextRise-ps))); const mx=X0+24+f*(W-48), my=Y0+120-Math.sin(Math.PI*f)*80, age=moonAge(now);
    if(!over||part){ o+=`<circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="12" fill="#2b3350"/><path d="${moonPath(+mx.toFixed(1),+my.toFixed(1),12,age)}" fill="#efe9d2"/>`; }
  }
  /* clouds */
  const nC=over?5:part?3:(R()<.5?1:0), cc=night?(over?"#2c3240":"#323a52"):over?"#c9cfd4":"#f7f8f6";
  for(let k=0;k<nC;k++){ const x=X0-40+R()*(W+20), y=Y0+8+R()*70, s2=.7+R()*.7, dur=(160+R()*140)|0;
    o+=`<g transform="translate(${x.toFixed(0)},${y.toFixed(0)}) scale(${s2.toFixed(2)})"><g>${anim?`<animateTransform attributeName="transform" type="translate" values="0 0;${W+80} 0" dur="${dur}s" begin="-${(R()*dur)|0}s" repeatCount="indefinite"/>`:""}<rect x="0" y="10" width="64" height="14" rx="7" fill="${cc}"/><circle cx="20" cy="10" r="11" fill="${cc}"/><circle cx="38" cy="6" r="14" fill="${cc}"/></g></g>`; }

/* ---------- drifting things in the room's gutters: leaves, snow, petals, fireflies, confetti ---------- */
let FX={kind:"none",p:[],raf:0,burst:0};
function fxSetup(){
  const c=$("#fx"); if(!c) return; const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let kind=DECOR.th.fx; const code=WX?WX.code:1;
  if((code>=71&&code<=77)||code===85||code===86) kind="snow";
  if(kind==="fireflies"&&!DECOR.night) kind="none";
  if(DECOR.bday) FX.burst=Date.now();
  FX.kind=reduce?"none":kind;
  const n={leaves:9,snow:46,petals:12,fireflies:16,none:0}[FX.kind]||0;
  FX.p=[...Array(n)].map(()=>fxNew(true));
  if(!FX.raf) FX.raf=requestAnimationFrame(fxLoop);
}
function fxNew(init){
  const W=innerWidth,H=innerHeight,k=FX.kind;
  const base={x:Math.random()*W,y:init?Math.random()*H:-30,r:Math.random()*Math.PI*2,vr:(Math.random()-.5)*.02,ph:Math.random()*6};
  if(k==="leaves") return {...base,vy:.35+Math.random()*.45,vx:.15,s:7+Math.random()*6,c:["#c8642a","#d99a2b","#a8452a","#8a8a3a"][Math.random()*4|0]};
  if(k==="snow") return {...base,vy:.25+Math.random()*.5,vx:0,s:1.2+Math.random()*2.2,c:DECOR.night?"rgba(240,244,248,.85)":"rgba(120,140,155,.45)"};
  if(k==="petals") return {...base,vy:.3+Math.random()*.35,vx:.2,s:4+Math.random()*3,c:["#f2c9d3","#fbeef0","#e9b8c4"][Math.random()*3|0]};
  if(k==="fireflies") return {...base,y:H*.35+Math.random()*H*.65,vy:0,vx:0,s:2,c:"#e6f08a"};
  return base;
}
function fxLoop(t){
  FX.raf=requestAnimationFrame(fxLoop);
  const c=$("#fx"); if(!c||document.hidden) return;
  if(c.width!==innerWidth||c.height!==innerHeight){ c.width=innerWidth; c.height=innerHeight; }
  const x=c.getContext("2d"); x.clearRect(0,0,c.width,c.height);
  const burst=FX.burst&&Date.now()-FX.burst<14000;
  if(FX.kind==="none"&&!burst) return;
  for(const p of FX.p){
    p.ph+=.012; p.y+=p.vy; p.x+=p.vx+Math.sin(p.ph)*.35; p.r+=p.vr;
    if(FX.kind==="fireflies"){ p.x+=Math.sin(p.ph*1.3)*.5; p.y+=Math.cos(p.ph)*.3; x.globalAlpha=.5+.5*Math.sin(p.ph*3); x.fillStyle=p.c; x.beginPath(); x.arc(p.x,p.y,p.s,0,7); x.fill(); x.globalAlpha=1; continue; }
    if(p.y>innerHeight+30||p.x>innerWidth+30){ Object.assign(p,fxNew(false)); }
    x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c;
    if(FX.kind==="leaves"){ x.beginPath(); x.moveTo(0,-p.s); x.bezierCurveTo(p.s*.8,-p.s*.4,p.s*.8,p.s*.5,0,p.s); x.bezierCurveTo(-p.s*.8,p.s*.5,-p.s*.8,-p.s*.4,0,-p.s); x.fill(); }
    else if(FX.kind==="petals"){ x.beginPath(); x.ellipse(0,0,p.s,p.s*.6,0,0,7); x.fill(); }
    else { x.beginPath(); x.arc(0,0,p.s,0,7); x.fill(); }
    x.restore();
  }
  if(burst){
    if(!FX.conf) FX.conf=[...Array(70)].map(()=>({x:Math.random()*innerWidth,y:-Math.random()*innerHeight*.6,vy:1.4+Math.random()*1.8,r:Math.random()*6,c:["#d9661f","#2b6d43","#27466e","#b8324f","#e0a83a"][Math.random()*5|0]}));
    for(const q of FX.conf){ q.y+=q.vy; q.r+=.08; x.save(); x.translate(q.x,q.y); x.rotate(q.r); x.fillStyle=q.c; x.fillRect(-4,-2,8,4); x.restore(); }
  } else FX.conf=null;
}

/* ---------- the print on the wall, and the almanac ---------- */
function printHtml(){
  const a=ART[DECOR.art]; if(!a) return "";
  return `<h2 class="lbl">On the wall <span class="sub">${esc(DECOR.th.name)}</span></h2><div class="pbody"><div class="frame"><div class="mat"><img src="art/${DECOR.art}.jpg" alt="${esc(a.t)}, ${esc(a.a)}, ${esc(a.y)}" decoding="async"></div></div>
    <figcaption>${esc(a.t)}<span>${esc(a.a)}, ${esc(a.y)}</span></figcaption></div>`;
}
function hangHtml(){ const a=ART[DECOR.art]; if(!a) return "";
  return `<svg class="wire" viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><path d="M22 30 L50 4 L78 30" fill="none" stroke="currentColor" stroke-width="1" vector-effect="non-scaling-stroke"/></svg><svg class="wire" viewBox="0 0 100 30" preserveAspectRatio="xMidYMin meet" aria-hidden="true"><circle cx="50" cy="4" r="2.6" fill="currentColor"/></svg><div class="frame"><div class="mat"><img src="art/${DECOR.art}.jpg" alt="${esc(a.t)}, ${esc(a.a)}, ${esc(a.y)}" decoding="async"></div></div><figcaption>${esc(a.t)}, ${esc(a.a)}</figcaption>`; }
function renderPrint(){ const hg=$("#hang"); if(hg&&hg.dataset.art!==DECOR.art+DECOR.id){ hg.innerHTML=hangHtml(); hg.dataset.art=DECOR.art+DECOR.id; } const el=$("#print"); if(el&&el.dataset.art!==DECOR.art+DECOR.id){ el.innerHTML=printHtml(); el.dataset.art=DECOR.art+DECOR.id; } const f=$("#credit"); if(f){ const a=ART[DECOR.art]; f.innerHTML=a?`Print on the wall: <a href="${esc(a.p)}" target="_blank" rel="noopener">${esc(a.t)}</a>, ${esc(a.a)}, ${esc(a.y)}. ${esc(a.l)}, ${esc(a.s)}.`:""; } }
function almanacFacts(){
  const {li,now}=DECOR, len=d=>(d.set-d.rise)/60000, L=len(li.s), dl=Math.round((L-len(li.y))*10)/10;
  const f=d=>d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit",timeZone:TZ()});
  const age=moonAge(now), si=seasonInfo(now), hs=upcomingHolidays(now,3);
  const tday=localDate(now), dd=h=>Math.round((h.d-tday)/DAY);
  const hol=hs.map(h=>({n:h.n,days:dd(h)}));
  return {rise:f(li.s.rise),set:f(li.s.set),len:`${Math.floor(L/60)} h ${Math.round(L%60)} m`,dl,age,moon:moonName(age),illum:Math.round((1-Math.cos(2*Math.PI*age/29.530588853))/2*100),si,hol};
}
function countdown(h){ return h.days===0?`Today is ${h.n}`:h.days===1?`${h.n} is tomorrow`:`${h.days} days to ${h.n}`; }
function almanacHtml(big){
  const a=almanacFacts(), r=big?48:30;
  const moon=`<svg class="moon" viewBox="0 0 ${r*2+4} ${r*2+4}" aria-hidden="true"><circle cx="${r+2}" cy="${r+2}" r="${r}" fill="${DECOR.night?"#2b3350":"#a9a495"}"/><path d="${moonPath(r+2,r+2,r,a.age)}" fill="${DECOR.night?"#efe9d2":"#fbf6e4"}"/><circle cx="${r+2}" cy="${r+2}" r="${r}" fill="none" stroke="currentColor" stroke-opacity=".18"/></svg>`;
  const dlTxt=Math.abs(a.dl)<0.5?"about the same as yesterday":`${Math.abs(a.dl)<1?Math.round(Math.abs(a.dl)*60)+" s":Math.round(Math.abs(a.dl))+" min"} ${a.dl<0?"shorter":"longer"} than yesterday`;
  return `<div class="alm">${moon}<div><div class="big2">${esc(a.moon)}</div><div class="w" style="color:var(--muted);font-size:.84rem">${a.illum}% lit tonight</div></div>
    <div class="lines"><div>Sunrise and sunset <span>${esc(a.rise)} · ${esc(a.set)}</span></div><div>Daylight <span>${esc(a.len)}, ${esc(dlTxt)}</span></div>
    <div>Season <span>Day ${a.si.day} of ${a.si.name}, ${a.si.left} days to ${a.si.next}</span></div>
    ${a.hol.map(h=>`<div>${esc(h.n)} <span>${h.days===0?"Today":h.days===1?"Tomorrow":`in ${h.days} days`}</span></div>`).join("")}</div></div>`;
}
function renderAlmanac(){ const el=$("#almanac"); if(el) el.innerHTML=`<h2 class="lbl">Almanac <span class="sub">Youngsville</span></h2>${almanacHtml(false)}`; }
function sceneAlmanac(){
  return `<div class="sc sc-alm"><section class="card alm-print"><h2 class="lbl">On the wall <span class="sub">${esc(DECOR.th?.name||"")}</span></h2><figure class="hang big">${hangHtml()}</figure></section>
  <section class="card"><h2 class="lbl">Almanac <span class="sub">Youngsville, NC</span></h2>${almanacHtml(true)}
  <h3>Birthdays coming up</h3>${bdayRows((D.birthdays||[]).slice(0,4))}</section></div>`;
}
/* the one fact the greeting leads with */
function decorFact(){
  const now=DECOR.now||new Date(), b=birthdayToday(), hs=upcomingHolidays(now,1), tday=localDate(now);
  if(b) return `It's ${b.name}'s birthday.`;
  const h=hs[0], dd=h?Math.round((h.d-tday)/DAY):99;
  if(h&&dd===0) return `Happy ${h.n}.`;
  const g=gameToday(now);
  if(g){ const L=LIVE[g.team]; if(L&&L.state==="in") return `The ${g.team} are on now: ${L.score.replace(/\s+/g," ")}.`; const nx=(g.next||[])[0]; if(nx) return `${g.team} tonight, ${fmtTime(new Date(nx.when))}: ${nx.name}.`; }
  const soon=(D?.birthdays||[]).find(x=>x.days>0&&x.days<=3);
  if(soon) return `${soon.name}'s birthday is ${soon.days===1?"tomorrow":new Date(soon.date+"T12:00:00").toLocaleDateString([],{weekday:"long"})}.`;
  if(h&&dd<=30) return countdown({n:h.n,days:dd})+".";
  const a=almanacFacts(); return `${a.moon} tonight, ${a.illum}% lit.`;
}
function cycleDecor(){
  const ids=["auto",...Object.keys(THEMES)], cur=store.getItem("cc_decor")||"auto", nx=ids[(ids.indexOf(cur)+1)%ids.length];
  if(nx==="auto") store.removeItem("cc_decor"); else store.setItem("cc_decor",nx);
  DECOR.id=null; applyDecor(); shellLine(); if(SCENE!=="overview") renderScene(false);
}
addEventListener("resize",()=>{ clearTimeout(window.__gz); window.__gz=setTimeout(()=>{ if(DECOR.th) drawGarland(); },200); });

async function start(model){
  D = model;
  $("#lock").hidden = true; $("#app").hidden = false; $("#ctl").hidden = false;
  shell(); renderHealth();
  setWall(location.hash==="#wall");
  $("#bMode").onclick = ()=>setWall(!document.body.classList.contains("wall"));
  $("#bFull").onclick = toggleFs; $("#bAwake").onclick = ()=>{ store.setItem("awake", wake?"0":"1"); toggleAwake(); };
  $("#bLock").onclick = ()=>{ store.removeItem("cc_pw"); location.reload(); };
  initV3(); wakeUI(); loadWx(); loadScores();
  $("#bDecor").onclick = cycleDecor; addEventListener("keydown",e=>{ if(e.target.tagName!=="INPUT"&&(e.key==="d"||e.key==="D")) cycleDecor(); });
  setInterval(()=>{ applyDecor(); shellLine(); }, 60000);
  setInterval(tick, 1000); setInterval(()=>{renderEvents();renderHealth();shellLine();}, 30000);
  setInterval(loadWx, 900000); setInterval(refreshData, 90000);
  // gentle drift protects panels from burn-in
  let k=0; setInterval(()=>{ k=(k+1)%4; document.body.style.transform = `translate(${[0,2,2,0][k]}px,${[0,0,2,2][k]}px)`; }, 300000);
}
async function boot(){
  if(PLAIN){ start(PLAIN); return; }
  $("#lock").hidden = false;
  const saved = store.getItem("cc_pw");
  if(saved){ try{ PASS = saved; start(await decryptBlob(BLOB, saved)); return; }catch(e){ store.removeItem("cc_pw"); } }
}
$("#f").addEventListener("submit", async e=>{
  e.preventDefault();
  try{ PASS = $("#pw").value.replace(/^[\s.,;:]+|[\s.,;:]+$/g, ""); const m = await decryptBlob(BLOB, PASS); if($("#rem").checked) store.setItem("cc_pw", PASS); start(m); }
  catch(err){ $("#msg").textContent = "Wrong passphrase."; }
});
boot();
</script>
