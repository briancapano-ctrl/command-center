<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="command-center" content="1">
<meta name="theme-color" content="#05070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Command Center</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070a;--ink:#eaf0f3;--mute:#8a98a1;--dim:#56636b;--line:rgba(255,255,255,.075);--card:rgba(255,255,255,.035);
  --acc:#4de3c2;--acc2:#7aa8ff;--warn:#ffb454;--bad:#ff6b5e;--ok:#4de3c2;
  --f:'Satoshi',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;--m:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --r:16px;--u:1rem;
}
*{box-sizing:border-box;margin:0}
html{font-size:16px;background:var(--bg)}
body{min-height:100vh;color:var(--ink);font:400 .94rem/1.45 var(--f);font-variant-numeric:tabular-nums lining-nums;-webkit-font-smoothing:antialiased;
  background:
   radial-gradient(900px 520px at 8% -8%,rgba(77,227,194,.11),transparent 60%),
   radial-gradient(800px 520px at 100% 108%,rgba(122,168,255,.10),transparent 60%),var(--bg);background-attachment:fixed}
body.night{filter:brightness(.5) saturate(.8)}
.mono{font-family:var(--m)}
.lbl{font:700 .68rem/1 var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:var(--r);padding:calc(var(--u)*1.05) calc(var(--u)*1.15);backdrop-filter:blur(6px);overflow:hidden}
.card>h2{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.7rem}
.card>h2 .sub{font:400 .72rem var(--f);color:var(--dim);letter-spacing:0;text-transform:none}
.wrap{max-width:1280px;margin:0 auto;padding:1.2rem 1rem 3rem}

/* header */
.top{display:grid;grid-template-columns:auto 1fr auto;gap:1.5rem;align-items:center;margin-bottom:1rem}
.clock{font:300 clamp(2.6rem,6vw,4.4rem)/1 var(--f);letter-spacing:-.04em}
.clock small{font-size:.38em;color:var(--mute);margin-left:.15em;letter-spacing:0}
.date{color:var(--mute);margin-top:.35rem;font-weight:500}
.hello h1{font:900 clamp(1.3rem,2.2vw,1.9rem)/1.1 var(--f);letter-spacing:-.025em}
.hello p{color:var(--mute);margin-top:.3rem;max-width:60ch}
.wx{display:flex;align-items:center;gap:.7rem;justify-content:flex-end}
.wx svg{width:2.4rem;height:2.4rem}
.wx .t{font:300 2rem/1 var(--f);letter-spacing:-.03em}
.wx .d{color:var(--mute);font-size:.78rem}
.ctl{position:fixed;top:.7rem;right:.7rem;display:flex;gap:.4rem;z-index:20;transition:opacity .4s}
.ctl button{font:500 .72rem var(--f);color:var(--mute);background:rgba(10,14,18,.8);border:1px solid var(--line);border-radius:999px;padding:.35rem .7rem;cursor:pointer}
.ctl button:hover,.ctl button.on{color:var(--ink);border-color:var(--acc)}
body.idle .ctl{opacity:0}
body.wall .ctl{top:auto;bottom:.6rem;right:.8rem}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.8rem;margin-bottom:.9rem}
.kpi .v{font:300 clamp(2rem,3.2vw,3rem)/1 var(--f);letter-spacing:-.04em;margin:.55rem 0 .25rem}
.kpi .n{color:var(--mute);font-size:.78rem}
.kpi .v.txt{font-size:clamp(1.3rem,2vw,1.9rem);line-height:1.15;margin:.8rem 0 .5rem}
body.wall .kpi .v.txt{font-size:clamp(1.6rem,4.2vh,3rem)}
.kpi svg.sp{position:absolute;right:.8rem;bottom:.7rem;width:42%;height:34%;max-height:5rem;opacity:.9}
body.wall .kpi{min-height:0}
.kpi.up .v{color:var(--warn)}

/* main grid */
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,.95fr);gap:.8rem;align-items:start}
.col{display:grid;gap:.8rem}
.task{display:grid;grid-template-columns:1.25rem 1fr auto;gap:.8rem;padding:.7rem 0;border-top:1px solid var(--line);align-items:start}
.task:first-of-type{border-top:0}
.task input{appearance:none;width:1.1rem;height:1.1rem;margin-top:.15rem;border:1.5px solid var(--dim);border-radius:50%;cursor:pointer;display:grid;place-content:center}
.task input:checked{background:var(--acc);border-color:var(--acc)}
.task input:checked::after{content:"";width:.3rem;height:.55rem;border:solid #04120d;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.task .t{font-weight:500;font-size:1rem}.task .w{color:var(--mute);font-size:.78rem;margin-top:.15rem}
.task.done .t{text-decoration:line-through;color:var(--dim)}
.pill{font:700 .62rem var(--f);letter-spacing:.08em;text-transform:uppercase;padding:.28rem .6rem;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.p-high{color:var(--bad)}.p-med{color:var(--warn)}.p-low{color:var(--mute)}.p-info{color:var(--acc2)}
.empty{color:var(--mute);padding:.6rem 0}
.work .wrow{display:flex;justify-content:space-between;gap:1rem;align-items:baseline;padding:.45rem 0;border-top:1px solid var(--line);font-size:.9rem}
.work .wrow:first-of-type{border-top:0}.work .wk{color:var(--mute);white-space:nowrap}.work .wv{font-weight:500;text-align:right}
.work .wv.hot{color:var(--warn,#ffb454)}.work .wv.bad{color:var(--bad)}
.work .wlinks{display:flex;gap:.6rem;margin-top:.5rem;font-size:.75rem}.work .wlinks a{color:var(--mute);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:.2rem .6rem}.work .wlinks a:hover{color:var(--ink);border-color:var(--acc)}
body.wall .work .wlinks{display:none}
.ev{display:grid;grid-template-columns:4.6rem 1fr auto;gap:.7rem;padding:.55rem 0;border-top:1px solid var(--line);align-items:baseline}
.ev:first-of-type{border-top:0}
.ev .when{color:var(--mute);font-size:.78rem}.ev .what{font-weight:500}.ev .in{font:500 .72rem var(--m);color:var(--acc)}
.ev.past{opacity:.45}.ev.now{background:linear-gradient(90deg,rgba(77,227,194,.12),transparent);margin:0 -1.15rem;padding-left:1.15rem;padding-right:1.15rem;border-top-color:transparent}
.day{font:700 .66rem var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:.9rem 0 .2rem}
.day:first-child{margin-top:0}
.game{padding:.6rem 0;border-top:1px solid var(--line)}.game:first-of-type{border-top:0}
.game .row{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem}
.game b{font-size:1rem}.game .sc{font:500 1.35rem var(--m);letter-spacing:-.02em}
.game .st{color:var(--mute);font-size:.76rem;margin-top:.1rem}
.livetag{display:inline-flex;align-items:center;gap:.35rem;color:var(--bad);font:700 .62rem var(--f);letter-spacing:.12em}
.livetag::before{content:"";width:.45rem;height:.45rem;border-radius:50%;background:var(--bad);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
.tri{width:100%;border-collapse:collapse;font-size:.82rem}.tri td{padding:.5rem .6rem .5rem 0;border-top:1px solid var(--line);vertical-align:top}.tri tr:first-child td{border-top:0}.tri td:first-child{color:var(--mute);width:4.5rem;font-weight:500}.tri td:last-child{color:var(--mute)}
.chan{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.7rem}
.ch{padding:.8rem 1rem}.ch .nm{display:flex;justify-content:space-between;align-items:center;gap:.5rem;font-weight:700}
.ch .h{color:var(--dim);font-size:.72rem;margin:.1rem 0 .4rem;word-break:break-all}.ch .s{font-size:.85rem}.ch .x{color:var(--mute);font-size:.72rem;margin-top:.3rem}
.dot{width:.55rem;height:.55rem;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(77,227,194,.15);flex:none}
.dot.snap{background:var(--warn);box-shadow:0 0 0 3px rgba(255,180,84,.15)}.dot.off{background:var(--dim);box-shadow:none}.dot.bad{background:var(--bad);box-shadow:0 0 0 3px rgba(255,107,94,.18)}
.health{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:1rem;color:var(--mute);font-size:.74rem;align-items:center}
.health span{display:inline-flex;align-items:center;gap:.4rem}
.stale{background:rgba(255,107,94,.12);border:1px solid rgba(255,107,94,.4);color:#ffb1aa;border-radius:12px;padding:.6rem .9rem;margin-bottom:.8rem;font-weight:500}
.foot{margin-top:1.4rem;color:var(--dim);font-size:.72rem}

/* lock */
#lock{max-width:340px;margin:22vh auto;padding:0 1rem;text-align:center}
#lock h1{font:900 1.7rem var(--f);letter-spacing:-.03em;margin-bottom:.4rem}#lock p{color:var(--mute);margin-bottom:1.1rem}
#lock input[type=password]{width:100%;padding:.8rem 1rem;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);font-size:1rem}
#lock button{margin-top:.8rem;width:100%;padding:.8rem;border-radius:12px;border:0;background:var(--acc);color:#04120d;font:700 1rem var(--f);cursor:pointer}
#lock label{display:block;margin-top:.8rem;color:var(--mute);font-size:.82rem}#msg{color:var(--bad);margin-top:.7rem;min-height:1.2em}

/* WALL MODE: one screen, no scrolling, big type */
body.wall{height:100vh;overflow:hidden}
body.wall .wrap{max-width:none;height:100vh;padding:1.4vh 1.4vw;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto auto;gap:1.2vh}
body.wall #stale:empty{margin-top:-1.2vh}
body.wall{font-size:clamp(13px,.55vw + .85vh,26px)}
body.wall .top{margin:0}
body.wall .clock{font-size:clamp(3rem,9vh,7rem)}
body.wall .kpis{margin:0;grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:1fr}
body.wall .kpi .v{font-size:clamp(2rem,6vh,4.4rem)}
body.wall .grid{grid-template-columns:1.25fr 1fr .95fr;min-height:0;height:100%}
body.wall .col{display:grid;height:100%;min-height:0;grid-template-rows:minmax(0,1fr);align-content:stretch;overflow:hidden}
body.wall .col:last-child{grid-template-rows:auto minmax(0,1fr)}
body.wall .col .card.fill{flex:1;min-height:0;overflow:hidden}
body.wall .foot,body.wall .chan-sec,body.wall .desk-only{display:none}
body.wall .wall-strip{display:flex}
.wall-strip{display:none;gap:.6rem;flex-wrap:wrap;align-items:center;justify-content:space-between}
.wall-strip .chip{display:inline-flex;align-items:center;gap:.5rem;padding:.4rem .8rem;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:.8em}

@media(max-width:980px){.top{grid-template-columns:1fr}.wx{justify-content:flex-start}.grid{grid-template-columns:1fr}.ctl{position:static;margin-bottom:.6rem}body.wall .ctl{position:fixed;margin:0}}
/* WALL MODE on a vertical (portrait) monitor: one tall column, bigger type, same no-scroll guarantee */
@media (orientation:portrait){
  body.wall{font-size:clamp(13px,1.45vw + .45vh,28px)}
  body.wall .wrap{padding:1.2vh 2.4vw;gap:1vh}
  body.wall .top{grid-template-columns:auto 1fr auto;row-gap:.2rem}
  body.wall .clock{font-size:clamp(3rem,9vw,8rem)}
  body.wall .kpis{grid-template-columns:repeat(2,1fr);grid-auto-flow:row;grid-auto-columns:auto}
  body.wall .kpis .kpi:last-child{grid-column:1/-1}
  body.wall .kpi .v{font-size:clamp(2rem,5.2vw,4.6rem)}
  body.wall .kpi .v.txt{font-size:clamp(1.6rem,4.4vw,3.2rem)}
  body.wall .grid{grid-template-columns:1fr;grid-template-rows:minmax(0,1.45fr) minmax(0,1.15fr) minmax(0,.7fr);gap:1vh}
  body.wall .col{display:grid;grid-template-rows:minmax(0,1fr);height:100%}
  body.wall .col:last-child{grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr)}
  body.wall .col:last-child .card{height:100%}
  body.wall .wall-strip{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

/* ===== v3: scenes, drawer, aurora ===== */
body::before{content:"";position:fixed;inset:-15%;z-index:-1;pointer-events:none;will-change:transform;
  background:radial-gradient(38% 34% at 18% 14%,var(--a1,rgba(77,227,194,.12)),transparent 70%),radial-gradient(34% 30% at 86% 84%,var(--a2,rgba(122,168,255,.10)),transparent 70%);animation:drift 50s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,3%) scale(1.1)}}
body[data-tod=morning]{--a1:rgba(255,180,84,.20);--a2:rgba(77,227,194,.10)}
body[data-tod=day]{--a1:rgba(77,163,255,.16);--a2:rgba(77,227,194,.10)}
body[data-tod=evening]{--a1:rgba(255,122,92,.18);--a2:rgba(150,110,255,.15)}
body[data-tod=night]{--a1:rgba(90,100,255,.10);--a2:rgba(77,227,194,.05)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kpi,.grid .card,.overlay>*{animation:rise .5s both}.kpis .kpi:nth-child(2){animation-delay:.05s}.kpis .kpi:nth-child(3){animation-delay:.1s}.kpis .kpi:nth-child(4){animation-delay:.15s}.kpis .kpi:nth-child(5){animation-delay:.2s}
.clk{cursor:pointer;transition:transform .15s,border-color .2s,box-shadow .2s}.clk:hover{transform:translateY(-2px);border-color:rgba(77,227,194,.45);box-shadow:0 8px 30px -12px rgba(77,227,194,.35)}
.hrow{display:flex;align-items:center;gap:.9rem}
.ring{width:3.1rem;height:3.1rem;flex:none;cursor:pointer;position:relative}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bgc{stroke:rgba(255,255,255,.1)}.ring .fg{stroke:var(--acc);transition:stroke-dashoffset .8s}.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 .72rem var(--f)}
.ring.cleared{filter:drop-shadow(0 0 8px rgba(77,227,194,.7))}
.snav{display:flex;gap:.35rem;flex-wrap:wrap;margin:0 0 .9rem}
.snav button{font:600 .76rem var(--f);color:var(--mute);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;padding:.4rem .85rem;cursor:pointer;transition:all .2s}
.snav button:hover{color:var(--ink)}.snav button.on{color:#04110d;background:var(--acc);border-color:var(--acc)}
.rot{position:fixed;left:0;bottom:0;height:3px;background:var(--acc);opacity:.7;width:0;z-index:30;transition:width 1s linear;pointer-events:none}
body[data-scene]:not([data-scene=overview]) :is(.kpis,.grid,.chan-sec){display:none}
body[data-scene=overview] .overlay{display:none}
.overlay{min-height:0}.overlay.still>*,body.booted .kpi,body.booted .grid .card{animation:none}
.sc{display:grid;gap:1rem;height:100%;min-height:0}
.sc>.card{overflow:hidden;min-height:0}
.big{font:300 clamp(2.4rem,5vw,4.2rem)/1 var(--f);letter-spacing:-.04em}
.sc-today{grid-template-columns:1.25fr 1fr}.sc-today .side{display:grid;gap:1rem;grid-template-rows:auto 1fr;min-height:0}
.tl{position:relative;min-height:520px}.tlin{position:absolute;inset:2.6rem .9rem .9rem 3.2rem}
.hr{position:absolute;left:-2.6rem;right:0;border-top:1px solid var(--line);font-size:.68rem;color:var(--dim)}.hr span{position:absolute;top:-.55rem;left:0;background:transparent}
.blk{position:absolute;left:.4rem;right:.4rem;background:linear-gradient(90deg,rgba(77,227,194,.22),rgba(122,168,255,.16));border:1px solid rgba(77,227,194,.35);border-radius:10px;padding:.3rem .6rem;overflow:hidden;display:flex;gap:.6rem;align-items:baseline}
.blk b{font-weight:700;font-size:.9rem}.blk small{color:var(--mute);white-space:nowrap}
.nowl{position:absolute;left:-2.6rem;right:0;border-top:2px solid var(--bad);z-index:3}.nowl span{position:absolute;right:0;top:-1.25rem;font:700 .68rem var(--f);color:var(--bad)}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin:.2rem 0 .4rem}.chip2{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:999px;padding:.2rem .7rem;font-size:.8rem}
.hourly{display:flex;gap:.2rem;justify-content:space-between}.hourly div{flex:1;text-align:center;font-size:.76rem;color:var(--mute);padding:.4rem .1rem;border-radius:10px}.hourly div:first-child{background:rgba(77,227,194,.1);color:var(--ink)}
.hourly svg{width:1.7rem;height:1.7rem;display:block;margin:.25rem auto}.hourly b{display:block;font-size:.95rem;color:var(--ink);font-weight:600}
.sun{display:flex;gap:1.2rem;color:var(--mute);font-size:.8rem;margin-top:.6rem}
.sc-sports{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.gc{display:flex;flex-direction:column;justify-content:space-between;gap:.8rem;padding:1.3rem}.gc.live{border-color:rgba(255,107,94,.6);box-shadow:0 0 0 1px rgba(255,107,94,.25),0 0 50px -10px rgba(255,107,94,.45)}
.gc .vs{display:flex;align-items:center;justify-content:space-between;gap:.6rem}.gc .tm{flex:1;text-align:center}.gc .tm img{width:clamp(56px,7vw,110px);height:clamp(56px,7vw,110px);object-fit:contain}
.gc .tm .ab{font:700 .8rem var(--f);color:var(--mute);letter-spacing:.1em;margin-top:.3rem}.gc .mid{text-align:center}.gc .score{font:300 clamp(2rem,4vw,3.6rem)/1 var(--f)}
.gc .when{font:600 1.05rem var(--f)}.gc .cd{color:var(--acc);font:600 .9rem var(--m)}.gc .last{color:var(--mute);font-size:.82rem}
.sc-inbox{grid-template-columns:repeat(3,1fr)}
.bar{display:grid;grid-template-columns:7.5rem 1fr 3.6rem;gap:.6rem;align-items:center;padding:.35rem 0;font-size:.86rem;text-decoration:none;color:var(--ink)}a.bar:hover .bl{color:var(--acc)}
.bl{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bt{height:.55rem;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden}.bt i{display:block;height:100%;border-radius:99px;transition:width .8s}.bn{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.sc h3,.drawer h3{font:700 .68rem var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:1rem 0 .3rem}
.sc-week{grid-template-columns:repeat(7,1fr)}.day7{padding:.8rem .8rem}.day7.today{border-color:rgba(77,227,194,.5);background:linear-gradient(180deg,rgba(77,227,194,.08),rgba(255,255,255,.02))}
.day7 .dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}.day7 .dh b{font:700 .95rem var(--f)}.day7 .dh small{color:var(--mute);font-size:.7rem;display:flex;align-items:center;gap:.25rem}.day7 .dh svg{width:1.3rem;height:1.3rem}
.it{padding:.4rem .5rem;border-radius:9px;background:rgba(255,255,255,.045);margin-bottom:.35rem;font-size:.82rem}.it small{display:block;color:var(--mute)}.it.game{border-left:3px solid var(--warn)}.it.ad{border-left:3px solid var(--acc2)}
.sc-pulse{grid-template-columns:repeat(auto-fit,minmax(230px,1fr));align-content:start}.pt{display:flex;flex-direction:column;gap:.35rem}.pt .nm{font:700 .95rem var(--f)}.pt .st{font:300 1.6rem/1.15 var(--f);letter-spacing:-.02em}.pt .nt{color:var(--dim);font-size:.74rem}
.dbk{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}.dbk.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,94vw);background:#0a0e12;border-left:1px solid var(--line);transform:translateX(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:41;display:flex;flex-direction:column}
.drawer.on{transform:none}.drawer header{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.2rem;border-bottom:1px solid var(--line)}.drawer header b{font:800 1.1rem var(--f)}
.drawer header button{font:600 .75rem var(--f);color:var(--mute);background:transparent;border:1px solid var(--line);border-radius:999px;padding:.3rem .8rem;cursor:pointer}.drawer #db{padding:1rem 1.2rem;overflow:auto}
.qa input{width:100%;margin:0 0 .6rem;padding:.55rem .8rem;border-radius:10px;border:1px dashed var(--line);background:rgba(255,255,255,.03);color:var(--ink);font:500 .88rem var(--f)}.qa input:focus{outline:none;border-color:var(--acc);background:rgba(77,227,194,.05)}
.task .x{opacity:0;border:0;background:transparent;color:var(--mute);font-size:1.1rem;cursor:pointer;padding:0 .3rem;transition:opacity .15s}.task:hover .x{opacity:1}.task .x:hover{color:var(--bad)}
body.wall .qa,body.wall .snav,body.wall .task .x{display:none}
body.wall .top{grid-row:1}body.wall #stale{grid-row:2}body.wall .kpis{grid-row:3}body.wall .grid{grid-row:4}body.wall .overlay{grid-row:3/5}body.wall .wall-strip{grid-row:5}body.wall .health{grid-row:6}
body.wall .snav.wallnav{display:flex;position:fixed;bottom:.55rem;left:50%;transform:translateX(-50%);margin:0;z-index:25;opacity:.0;transition:opacity .4s}body.wall:not(.idle) .snav.wallnav{opacity:1}
body.wall .sc-today .tl{min-height:0}
@media(max-width:980px){.sc-today,.sc-inbox,.sc-week{grid-template-columns:1fr}.sc-week .day7{min-height:0}}
@media (orientation:portrait){body.wall .sc-today,body.wall .sc-inbox{grid-template-columns:1fr}body.wall .sc-week{grid-template-columns:repeat(2,1fr)}body.wall .sc-today{grid-template-rows:minmax(0,1.3fr) minmax(0,1fr)}}
body.wall .snav.wallnav{opacity:.65;bottom:.4rem;gap:.45rem;align-items:center}
body.wall .snav.wallnav button{font-size:0;width:9px;height:9px;padding:0;border-radius:50%;background:rgba(255,255,255,.25);border:0}
body.wall .snav.wallnav button.on{background:var(--acc);width:22px;border-radius:99px}
body.wall:not(.idle) .snav.wallnav{opacity:1}
body.wall:not(.idle) .snav.wallnav button{font-size:.7rem;width:auto;height:auto;padding:.3rem .7rem;border-radius:999px;border:1px solid var(--line)}
body.wall:not(.idle) .snav.wallnav #bAuto{display:inline-block !important}
body.wall:not(.idle) .snav.wallnav button.on{color:#04110d;width:auto}
.gc .tm img{width:clamp(64px,11vh,150px);height:clamp(64px,11vh,150px)}.gc{justify-content:space-around}
.gc .when{font-size:clamp(1rem,1.6vw,1.5rem)}.gc .cd{font-size:clamp(.9rem,1.2vw,1.2rem)}
.pt{padding:1.4rem}.pt .st{font-size:clamp(1.6rem,2.6vw,2.6rem)}.pt .nm{font-size:1.05rem}
.hr{font-size:.76rem}
@media (orientation:portrait){body.wall .sc-sports{grid-template-columns:1fr}}
.snav #bAuto{display:none}
.drawer .it{margin-bottom:.4rem}
</style>

/* ---------- crypto ---------- */
async function decryptBlob(blob, pass){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(blob.salt), iterations:blob.iter, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(blob.iv)}, key, b64(blob.ct))));
}

const TZ = () => (D && D.meta && D.meta.tz) || "America/New_York";
const dkey = d => new Intl.DateTimeFormat("en-CA", {timeZone:TZ(), year:"numeric", month:"2-digit", day:"2-digit"}).format(d);
const hourIn = d => Number(new Intl.DateTimeFormat("en-US", {hour:"numeric", hour12:false, timeZone:TZ()}).format(d)) % 24;
const dayDiff = d => Math.round((Date.parse(dkey(d)) - Date.parse(dkey(new Date()))) / 86400000);
const fmtTime = d => d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit", timeZone:TZ()});
const rel = ms => { const m = Math.round(ms/60000); if(m<1) return "now"; if(m<60) return m+"m"; const h=Math.floor(m/60); return (h<24 ? h+"h "+(m%60?(m%60)+"m":"") : Math.floor(h/24)+"d").trim(); };
function spark(vals, color){
  if(!vals || vals.length<2) return "";
  const w=100,h=40,mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;
  const pts = vals.map((v,i)=>[(i/(vals.length-1))*w, h-4-((v-mn)/r)*(h-8)]);
  const d = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const last = pts[pts.length-1];
  return `<svg class="sp" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="2.2" fill="${color}"/></svg>`;
}

const prevVals = {};

  });
}

function renderEvents(){

  Object.keys(byDay).sort().forEach(k=>{
    const list=byDay[k]; const d0=new Date(k+"T12:00:00"); const diff=Math.round((Date.parse(k)-Date.parse(dkey(now)))/86400000);
    const label = diff===0 ? "Today" : diff===1 ? "Tomorrow" : d0.toLocaleDateString([], {weekday:"long", month:"short", day:"numeric"});
    html += `<div class="day">${esc(label)}</div>`;
    list.sort((a,b)=>(b.all_day?1:0)-(a.all_day?1:0) || a._d-b._d).forEach(e=>{
      const past = !e.all_day && e._d<now && diff===0; const soon = !e.all_day && e._d>=now && e._d-now<3600000*3 && diff===0;

/* wall mode: hide trailing rows that do not fit, so nothing is ever cut in half */
let fitQ=0;
function fit(){ cancelAnimationFrame(fitQ); fitQ=requestAnimationFrame(()=>{
  const items = c => [...c.querySelectorAll("#tasks>*, #events>*, #teams>*, .tri tr, #work .wrow")];
  document.querySelectorAll(".grid .col").forEach(col=>{
    const cards=[...col.querySelectorAll(".card")];
    cards.forEach(c=>{ items(c).forEach(i=>i.style.display=""); if(c.classList.contains("tri-card")) c.style.display=""; });
    if(!document.body.classList.contains("wall")) return;
    const over = c => c.scrollHeight > c.clientHeight+1;
    for(let g=0; g<200; g++){
      let target = cards.find(c=>over(c) && items(c).filter(i=>i.style.display!=="none").length>1);
      if(!target && over(col)) target = [...cards].reverse().find(c=>items(c).filter(i=>i.style.display!=="none").length>1);
      if(!target){ const tri = cards.find(c=>c.classList.contains("tri-card") && c.style.display!=="none" && over(c)); if(tri){ tri.style.display="none"; continue; } break; }
      let vis = items(target).filter(i=>i.style.display!=="none"); vis[vis.length-1].style.display="none";
      vis = items(target).filter(i=>i.style.display!=="none"); while(vis.length>1 && vis[vis.length-1].classList.contains("day")){ vis[vis.length-1].style.display="none"; vis.pop(); }
    }
  });
});}

async function loadScores(){

      const j = await (await fetch(`https://site.api.espn.com/apis/site/v2/sports/${t.path}/scoreboard`)).json();

   <section class="card tl"><h2 class="lbl">Today <span class="sub">${esc(now.toLocaleDateString([],{weekday:"long",month:"long",day:"numeric",timeZone:TZ()}))}</span></h2>
     ${allday.length?`<div class="chips">${allday.map(e=>`<span class="chip2">${esc(e.title)}</span>`).join("")}</div>`:""}
     <div class="tlin">${lines}${blocks}${nl}${empty}</div></section>
   <div class="side"><section class="card"><h2 class="lbl">Next 12 hours <span class="sub">${WX?`${Math.round(WX.t)}&deg; now`:""}</span></h2>${hrs?`<div class="hourly">${hrs}</div>`:'<div class="w">Loading forecast</div>'}
     ${WX?.sunrise?`<div class="sun"><span>Sunrise ${esc(WX.sunrise)}</span><span>Sunset ${esc(WX.sunset)}</span></div>`:""}</section>
     <section class="card"><h2 class="lbl">Still open <span class="sub">${open.length} shown</span></h2>${open.length?open.map(x=>`<div class="it">${esc(x.t)}<small>${esc(x.w)}</small></div>`).join(""):'<div class="w">All clear.</div>'}</section></div></div>`;
}
function sceneSports(){
  const cards=(D.teams||[]).map(t=>{
    const L=LIVE[t.team], lt=(t.last||[])[0], nx=(t.next||[])[0];
    const me=lg(t.path,t.abbr);
    let away,home,mid,status="",cls="";
    if(L&&L.away){
      away=L.away;home=L.home;
      if(L.state==="pre"){mid=`<div class="when">${esc(L.detail||"")}</div>`;status=nx?`<div class="cd">in ${esc(COUNT(new Date(nx.when)-Date.now()))}</div>`:""}
      else {mid=`<div class="score">${esc(away.s)} - ${esc(home.s)}</div>`; status=L.state==="in"?`<div class="cd" style="color:var(--bad)">LIVE &middot; ${esc(L.detail||"")}</div>`:`<div class="cd">Final</div>`; if(L.state==="in")cls="live";}
    } else if(nx){
      const parts=String(nx.name||"").split(/\s+(?:@|at|vs\.?)\s+/i); away={a:parts[0]}; home={a:parts[1]||t.abbr};
      mid=`<div class="when">${esc(new Date(nx.when).toLocaleString([],{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit",timeZone:TZ()}))}</div>`;
      status=`<div class="cd">in ${esc(COUNT(new Date(nx.when)-Date.now()))}</div>`;
    } else { away={a:t.abbr}; home={a:""}; mid='<div class="when">No game scheduled</div>'; }
    const lastTxt=lt?"Last: "+Object.entries(lt.score||{}).map(([a,b])=>a+" "+b).join(", "):"";
    const side=x=>`<div class="tm">${x.a?logo(t.path,x.a):""}<div class="ab">${esc(x.a||"")}</div></div>`;
    return `<section class="card gc ${cls}"><h2 class="lbl">${esc(t.team)}</h2><div class="vs">${side(away)}<div class="mid">${mid}${status}</div>${side(home)}</div><div class="last">${esc(lastTxt)}</div></section>`;
  }).join("");
  return `<div class="sc sc-sports">${cards||'<section class="card"><div class="w">No teams configured.</div></section>'}</div>`;
}
function sceneInbox(){
  return `<div class="sc sc-inbox"><section class="card"><h2 class="lbl">Gmail <span class="sub">briancapano@gmail.com</span></h2>${gmailCard()}</section>
  <section class="card"><h2 class="lbl">Hotmail <span class="sub">personal</span></h2>${hotmailCard()}</section>
  <section class="card"><h2 class="lbl">Texts <span class="sub">iMessage</span></h2>${textsCard()}</section></div>`;
}
function sceneWeek(){
  const now=new Date(), base=Date.parse(dkey(now)+"T12:00:00");
  const days=Array.from({length:7},(_,i)=>{const d=new Date(base+i*86400000);return{k:dkey(d),d}});
  const wx={};(WX?.daily||[]).forEach(w=>wx[w.d]=w);
  const cols=days.map((x,i)=>{
    const ev=(D.events||[]).filter(e=>e.start&&(e.all_day?e.start.slice(0,10)===x.k:dkey(new Date(e.start))===x.k)).sort((a,b)=>(b.all_day?1:0)-(a.all_day?1:0)||new Date(a.start)-new Date(b.start));
    const gm=(D.teams||[]).flatMap(t=>(t.next||[]).filter(n=>dkey(new Date(n.when))===x.k).map(n=>({t:t.team,n})));
    const w=wx[x.k];
    return `<section class="card day7 ${i===0?"today":""}"><div class="dh"><b>${i===0?"Today":x.d.toLocaleDateString([],{weekday:"short",timeZone:"UTC"})} <span style="color:var(--mute);font-weight:500">${x.d.getUTCDate()}</span></b>${w?`<small>${WXI[wxInfo(w.code)[0]]}${Math.round(w.hi)}&deg;/${Math.round(w.lo)}&deg;</small>`:""}</div>
      ${ev.map(e=>`<div class="it ${e.all_day?"ad":""}">${esc(e.title)}<small>${e.all_day?"All day":esc(fmtTime(new Date(e.start)))}</small></div>`).join("")}
      ${gm.map(g=>`<div class="it game">${esc(g.t)}<small>${esc(g.n.name)} &middot; ${esc(fmtTime(new Date(g.n.when)))}</small></div>`).join("")}
      ${!ev.length&&!gm.length?'<div class="w" style="color:var(--dim)">Open</div>':""}</section>`;
  }).join("");
  return `<div class="sc sc-week">${cols}</div>`;
}
function scenePulse(){
  const dc={live:"var(--acc)",snap:"var(--warn)",off:"var(--dim)"};
  const ch=(D.channels||[]).map(c=>`<section class="card pt"><div class="nm"><span class="dot" style="background:${dc[c.state]||"var(--acc)"};display:inline-block;width:.5rem;height:.5rem;border-radius:50%;margin-right:.45rem"></span>${esc(c.name)}</div><div class="st">${esc(c.stat||"")}</div><div class="nt">${esc([c.handle,c.state==="snap"?"manual entry":c.state==="off"?"not connected":"",c.next].filter(Boolean).join(" \u00b7 "))}</div></section>`).join("");
  const now=new Date();
  const src=(D.sources||[]).map(s=>{const age=s.updated?(now-new Date(s.updated))/60000:null;return `<span class="chip2" style="border-color:${s.ok?"rgba(77,227,194,.4)":"rgba(255,107,94,.5)"}">${s.ok?"&#9679;":"&#9888;"} ${esc(s.label)} ${s.ok&&age!==null?esc(rel(age*60000))+" ago":"offline"}</span>`}).join("");
  return `<div class="sc sc-pulse">${ch}<section class="card" style="grid-column:1/-1"><h2 class="lbl">Data sources</h2><div class="chips">${src}</div></section></div>`;
}
const RENDER={today:sceneToday,sports:sceneSports,inbox:sceneInbox,week:sceneWeek,pulse:scenePulse};
function renderScene(fresh=true){
  const ov=$("#overlay"); if(!ov) return; ov.classList.toggle("still",!fresh);
  ov.innerHTML=SCENE==="overview"?"":RENDER[SCENE]();
  document.querySelectorAll("#snav button[data-s]").forEach(b=>b.classList.toggle("on",b.dataset.s===SCENE));
}
function setScene(id,user){
  SCENE=id; sceneAt=Date.now(); if(user) pauseUntil=Date.now()+5*60000; if(id==="sports") lastSports=Date.now();
  document.body.dataset.scene=id; renderScene(); fit();
}
function autoTick(){
  const b=document.body, rot=$("#rot"); if(!rot) return;
  b.dataset.tod=(h=>h<5?"night":h<11?"morning":h<17?"day":h<21?"evening":"night")(hourIn(new Date()));
  if(!b.classList.contains("wall")||!autoOn||Date.now()<pauseUntil){ rot.style.width="0"; return; }
  const live=Object.values(LIVE).some(l=>l.state==="in"), cur=SCENES.find(s=>s[0]===SCENE)||SCENES[0];
  const dur=(SCENE==="sports"&&live?45:cur[2])*1000, el=Date.now()-sceneAt;
  rot.style.width=Math.min(100,el/dur*100)+"%";
  if(el>=dur){
    const i=SCENES.findIndex(s=>s[0]===SCENE);
    setScene(live&&SCENE!=="sports"&&Date.now()-lastSports>100000?"sports":SCENES[(i+1)%SCENES.length][0]);
  }
}
function navHtml(){ return SCENES.map(s=>`<button data-s="${s[0]}">${s[1]}</button>`).join("")+`<button id="bAuto" class="${autoOn?"on":""}" title="Auto-rotate scenes on the wall display (Space)">Auto</button>`; }
function toggleAuto(){ autoOn=!autoOn; store.setItem("cc_auto",autoOn?"1":"0"); sceneAt=Date.now(); $("#bAuto")?.classList.toggle("on",autoOn); }
addEventListener("click",e=>{ if(e.target.id==="bAuto") toggleAuto(); });
addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT") return;
  const i=SCENES.findIndex(s=>s[0]===SCENE);
  if(e.key==="ArrowRight") setScene(SCENES[(i+1)%SCENES.length][0],true);
  else if(e.key==="ArrowLeft") setScene(SCENES[(i+SCENES.length-1)%SCENES.length][0],true);
  else if(e.key===" "){ e.preventDefault(); toggleAuto(); }
  else if(e.key==="Escape") closeDrawer();
  else if(/^[1-6]$/.test(e.key)) setScene(SCENES[Number(e.key)-1][0],true);
});
function initV3(){
  if(!$("#drawer")){ document.body.insertAdjacentHTML("beforeend",`<div class="dbk" id="dbk"></div><aside class="drawer" id="drawer"><header><b id="dt"></b><button id="dx">Close</button></header><div id="db"></div></aside><div class="rot" id="rot"></div>`); }
  setInterval(autoTick,1000); setInterval(()=>{ if(SCENE!=="overview"&&!$("#drawer").classList.contains("on")) renderScene(false); },30000);
  setScene(SCENE); setTimeout(()=>document.body.classList.add("booted"),1800);
}

async function start(model){
  D = model;
  $("#lock").hidden = true; $("#app").hidden = false; $("#ctl").hidden = false;
  shell(); renderHealth();
  setWall(location.hash==="#wall");
  $("#bMode").onclick = ()=>setWall(!document.body.classList.contains("wall"));
  $("#bFull").onclick = toggleFs; $("#bAwake").onclick = ()=>{ store.setItem("awake", wake?"0":"1"); toggleAwake(); };
  $("#bLock").onclick = ()=>{ store.removeItem("cc_pw"); location.reload(); };
  initV3(); wakeUI(); loadWx(); loadScores();
  setInterval(tick, 1000); setInterval(()=>{renderEvents();renderHealth();shellLine();}, 30000);
  setInterval(loadWx, 900000); setInterval(refreshData, 90000);
  // gentle drift protects panels from burn-in
  let k=0; setInterval(()=>{ k=(k+1)%4; document.body.style.transform = `translate(${[0,2,2,0][k]}px,${[0,0,2,2][k]}px)`; }, 300000);
}
async function boot(){
  if(PLAIN){ start(PLAIN); return; }
  $("#lock").hidden = false;
  const saved = store.getItem("cc_pw");
  if(saved){ try{ PASS = saved; start(await decryptBlob(BLOB, saved)); return; }catch(e){ store.removeItem("cc_pw"); } }
}
$("#f").addEventListener("submit", async e=>{
  e.preventDefault();
  try{ PASS = $("#pw").value.replace(/^[\s.,;:]+|[\s.,;:]+$/g, ""); const m = await decryptBlob(BLOB, PASS); if($("#rem").checked) store.setItem("cc_pw", PASS); start(m); }
  catch(err){ $("#msg").textContent = "Wrong passphrase."; }
});
boot();
</script>
